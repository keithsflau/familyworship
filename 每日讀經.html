<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>每日讀經 · 一家同行</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --night: #1a120e;
    --lamp: #f0b14a;
    --coral: #d4653a;
    --leaf: #3f6d52;
    --ink: #2a1c14;
    --muted: #6d5646;
    --cream: #fff8ea;
    --paper: #f6ead2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Noto Sans TC", sans-serif;
    color: var(--paper);
    background: radial-gradient(ellipse 80% 50% at 50% -10%, #3b2a18 0%, transparent 55%), var(--night);
  }
  button, select { font-family: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 18px 80px; }
  h1 { font-family: Fraunces, serif; font-size: 28px; margin: 0 0 4px; }
  .sub { color: #cbb49a; font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .stats { display: flex; gap: 16px; margin: 16px 0 8px; }
  .stat { background: #2a1c14; border: 2px solid #5a3b28; border-radius: 16px; padding: 10px 14px; min-width: 88px; }
  .stat b { display: block; font-family: Fraunces, serif; font-size: 22px; color: var(--lamp); }
  .stat span { font-size: 12px; color: #cbb49a; }
  .bar { height: 8px; background: #4a3428; border-radius: 99px; overflow: hidden; margin: 8px 0 16px; }
  .bar i { display: block; height: 100%; background: var(--leaf); width: 0; }
  .card { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 18px; }
  .card h2 { font-family: Fraunces, serif; font-size: 22px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .ref {
    display: inline-block; background: #efe0c4; border-radius: 999px;
    padding: 4px 10px; font-weight: 700; font-size: 13px; margin: 4px 0 10px;
  }
  .tip { font-size: 16px; line-height: 1.7; margin: 8px 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .big {
    border: 0; border-radius: 16px; padding: 12px 16px; cursor: pointer; font-weight: 700;
    font-size: 15px; color: #fff;
  }
  .tick { background: var(--leaf); }
  .tick.on { background: var(--coral); }
  .ghost { background: #5c4638; }
  .read { background: #355c7d; }
  .who { display: flex; gap: 6px; margin: 8px 0 12px; }
  .who button {
    border: 0; background: #efe0c4; color: var(--ink); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  .who button.on { background: #355c7d; color: #fff; }
  .nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .cal b { text-align: center; font-size: 11px; color: var(--muted); }
  .day {
    aspect-ratio: 1; border: 0; border-radius: 10px; background: #efe0c4; color: var(--ink);
    cursor: pointer; font-size: 13px;
  }
  .day.done { background: var(--leaf); color: #fff; }
  .day.today { outline: 2px solid var(--coral); }
  .day.mute { opacity: 0.35; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .month-nav h3 { font-family: Fraunces, serif; margin: 0; font-size: 18px; }
  .link { color: var(--coral); }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #fff8ea; color: var(--ink); padding: 10px 16px; border-radius: 999px;
    display: none; z-index: 9;
  }
  .sat { background: #fff3d6; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .scripture { margin: 12px 0 14px; }
  .pass {
    background: #fff; border: 1px solid #ead7b8; border-radius: 16px;
    padding: 12px 14px 8px; margin-bottom: 10px;
  }
  .pass-head { font-weight: 700; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .verses { font-size: 17px; line-height: 1.85; }
  .verses .v { margin: 0 0 10px; }
  .verses .n {
    display: inline-block; min-width: 1.3em; color: var(--coral);
    font-weight: 700; font-size: 13px; margin-right: 4px;
  }
  .verses .miss { color: var(--muted); font-size: 14px; }
  .copy { font-size: 11px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>每日讀經</h1>
      <div class="sub">鋒、恩同姐姐、弟弟 · 一日一小段 · 讀完就 tick</div>
    </div>
    <a class="sub link" href="index.html">星期六晚劇場</a>
  </header>
  <div class="stats">
    <div class="stat"><b id="doneN">0</b><span>已讀日數</span></div>
    <div class="stat"><b id="streak">0</b><span>連續日數</span></div>
    <div class="stat"><b>365</b><span>全年日子</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <article class="card" id="todayCard">
    <div class="meta" id="meta"></div>
    <h2 id="title"></h2>
    <div class="ref" id="ref"></div>
    <div class="scripture" id="scripture"></div>
    <p class="tip" id="tip"></p>
    <p class="sat" id="satNote" hidden>今晚 21:00 家庭崇拜。朝早讀完呢段就可以 tick。 <a class="link" href="index.html">打開星期六晚劇場</a></p>
    <div class="who" id="who">
      <span class="meta" style="margin:6px 8px 0 0">今日邊個讀</span>
      <button type="button" data-who="sis">姐姐</button>
      <button type="button" data-who="bro">弟弟</button>
      <button type="button" data-who="both">一齊</button>
    </div>
    <div class="row">
      <button class="big tick" id="btnTick">讀完，tick</button>
      <button class="big read" id="btnRead">廣東話讀經文</button>
      <button class="big ghost" id="btnStop">停</button>
    </div>
    <div class="nav">
      <button class="big ghost" id="prev">上一目</button>
      <button class="big ghost" id="now">跳到今日</button>
      <button class="big ghost" id="next">下一日</button>
    </div>
  </article>

  <div class="month-nav">
    <button class="big ghost" id="mPrev">上個月</button>
    <h3 id="monthTitle"></h3>
    <button class="big ghost" id="mNext">下個月</button>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="cal" id="cal"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const DAYS = [{"date":"2026-09-17","dow":"四","week":1,"theme":"我們為何家庭崇拜","verse":"申 6:5","ref":"約書亞記 1:8","title":"晝夜思想","tip":"律法書唔好離開口，晝夜思想，就必亨通。","sat":false,"passages":[{"osis":"Josh","fhl":"書","chap":1,"secs":"8","verses":[{"n":8,"text":"不可讓這律法書離開你的口，而要日夜咀嚼，好使你謹守遵行一切寫在這書上的。由此，你的道路都必亨通，也必能順利。"}],"src":"ccv"}]},{"date":"2026-09-18","dow":"五","week":1,"theme":"我們為何家庭崇拜","verse":"申 6:5","ref":"申命記 6:6–7","title":"返屋企都講","tip":"呢啲話要記喺心，殷勤教訓兒女，坐行瞓起都講。","sat":false,"passages":[{"osis":"Deut","fhl":"申","chap":6,"secs":"6-7","verses":[{"n":6,"text":"我今天吩咐你的這些話，你要存在心裏。"},{"n":7,"text":"你要向你兒子反複講述，無論坐在家中，還是走在路上，是躺下，還是起來，都要講論。"}],"src":"ccv"}]},{"date":"2026-09-19","dow":"六","week":1,"theme":"我們為何家庭崇拜","verse":"申 6:5","ref":"申命記 6:4–9","title":"今晚家庭崇拜","tip":"朝早讀短段。今晚 21:00 一齊家庭崇拜。","sat":true,"passages":[{"osis":"Deut","fhl":"申","chap":6,"secs":"4-9","verses":[{"n":4,"text":"「以色列啊，你要聽！上主我們的神是獨一的上主。"},{"n":5,"text":"你要盡你全部的心思、全部的性命、全部的力量，愛上主你的神。"},{"n":6,"text":"我今天吩咐你的這些話，你要存在心裏。"},{"n":7,"text":"你要向你兒子反複講述，無論坐在家中，還是走在路上，是躺下，還是起來，都要講論。"},{"n":8,"text":"你要把它們綁在手上為記號，它們要作你額上的標記。"},{"n":9,"text":"你也要把它們寫在你房屋的門框和城門上。"}],"src":"ccv"}]},{"date":"2026-09-20","dow":"日","week":2,"theme":"神的話是燈","verse":"申 6:5","ref":"詩篇 119:105","title":"腳前的燈","tip":"你的話係我腳前的燈，路上的光。","sat":false,"passages":[{"osis":"Ps","fhl":"詩","chap":119,"secs":"105","verses":[{"n":105,"text":"<h3>立誓專心遵行 神律例</h3>你的話是我腳前的燈，是我路上的光。"}],"src":"ncv"}]},{"date":"2026-09-21","dow":"一","week":2,"theme":"神的話是燈","verse":"申 6:5","ref":"約翰福音 8:12","title":"世界的光","tip":"耶穌話：我係世界的光。跟從我嘅，唔喺黑暗行。","sat":false,"passages":[{"osis":"John","fhl":"約","chap":8,"secs":"12","verses":[{"n":12,"text":"<h3>耶穌是世界的光</h3>耶穌又對眾人說：「我是世界的光，跟從我的，必定不在黑暗裡走，卻要得著生命的光。」"}],"src":"ncv"}]},{"date":"2026-09-22","dow":"二","week":2,"theme":"神的話是燈","verse":"申 6:5","ref":"詩篇 19:7–8","title":"律法完全","tip":"耶和華的律法完全，能甦醒人心，使愚人有智慧。","sat":false,"passages":[{"osis":"Ps","fhl":"詩","chap":19,"secs":"7-8","verses":[{"n":7,"text":"耶和華的律法是完全的，能使人心甦醒；耶和華的法度是堅定的，能使愚人有智慧 ，以及一切在地上爬行的！」"}],"src":"ccv"}]},{"date":"2026-09-28","dow":"一","week":3,"theme":"神設立家庭","verse":"弗 6:1","ref":"創世記 2:18–24","title":"家是禮物","tip":"神話人單獨唔好，設立家庭，二人成為一體。","sat":false,"passages":[{"osis":"Gen","fhl":"創","chap":2,"secs":"18-24","verses":[{"n":18,"text":"上主神說：「那人獨自一人不好，我要為他造一個與他相配的幫手。」"},{"n":19,"text":"上主神用土塑造出田野各樣的走獸和天上各樣的鳥，帶到那人跟前，看他叫牠甚麼。那人怎樣叫各種有生命的活物，那就成了牠的名字。"},{"n":20,"text":"那人給所有的牲畜和天上的鳥，以及田野所有的走獸都起了名；但對亞當來說，卻沒找到一個與他相配的幫手。"},{"n":21,"text":"上主神使沉睡臨到那人，那人就睡了；於是上主取出他的一根肋骨，又合上那處的肉。"},{"n":22,"text":"上主神用那人身上取出的肋骨造了一個女人，將她帶到那人面前。"},{"n":23,"text":"那人說：「這一個真是 我骨中的骨 我肉中的肉；這一個要稱為女人，因為這一個 取自男人。」"},{"n":24,"text":"因此，男人要離開他的父母，與他的妻子緊緊相連，兩人要成為一體。"}],"src":"ccv"}]},{"date":"2026-09-29","dow":"二","week":3,"theme":"神設立家庭","verse":"弗 6:1","ref":"詩篇 127:1–3","title":"兒女是產業","tip":"若唔係耶和華建造房屋，建造的人就枉然。兒女是產業。","sat":false,"passages":[{"osis":"Ps","fhl":"詩","chap":127,"secs":"1-3","verses":[{"n":1,"text":"<h3>人的產業都是 神所賜 （所羅門朝聖之歌（原文作“往上行之歌」）。）</h3>如果不是耶和華建造房屋，建造的人就徒然勞苦；如果不是耶和華看守城池，看守的人就徒然警醒。（本節在《馬索拉抄本》包括細字標題）"},{"n":2,"text":"你們清早起來，很晚才歇息，吃勞碌得來的飯，都是徒然；因為主必使他所愛的安睡。"},{"n":3,"text":"兒女是耶和華所賜的產業，腹中的胎兒是他的賞賜。"}],"src":"ncv"}]},{"date":"2026-09-30","dow":"三","week":3,"theme":"神設立家庭","verse":"弗 6:1","ref":"以弗所書 5:1–2","title":"效法神","tip":"你們既是蒙愛的兒女，就當效法神，憑愛心行事。","sat":false,"passages":[{"osis":"Eph","fhl":"弗","chap":5,"secs":"1-2","verses":[{"n":1,"text":"因此，你們既然是蒙愛的兒女，就應當效法 神。"},{"n":2,"text":"要憑著愛心行事，好像基督愛我們，為我們捨己，當作馨香的供品和祭物獻給 神。"}],"src":"ncv"}]},{"date":"2026-10-01","dow":"四","week":3,"theme":"神設立家庭","verse":"弗 6:1","ref":"歌羅西書 3:12–14","title":"穿上愛","tip":"要存憐憫、恩慈、謙虛、溫柔、忍耐，在這一切之外要穿上愛。","sat":false,"passages":[{"osis":"Col","fhl":"西","chap":3,"secs":"12-14","verses":[{"n":12,"text":"所以，你們既然是 神所揀選的，是聖潔、蒙愛的人，就要存憐憫的心腸、恩慈、謙卑、溫柔和忍耐。"},{"n":13,"text":"如果有人對別人有嫌隙，總要彼此寬容，互相饒恕；主怎樣饒恕了你們，你們也要照樣饒恕人。"},{"n":14,"text":"在這一切之上，還要有愛心，愛心是聯繫全德的。"}],"src":"ncv"}]},{"date":"2026-10-02","dow":"五","week":3,"theme":"神設立家庭","verse":"弗 6:1","ref":"詩篇 133:1","title":"和睦同居","tip":"看哪，弟兄和睦同居，是何等的善， n":13,"text":"過了不多幾天，小兒子收拾一切，到遠方去了，在那裡生活放蕩，浪費錢財。"},{"n":14,"text":"他花盡了一切所有的，那地方又遇上了嚴重的饑荒，就窮困起來；"},{"n":15,"text":"於是他去投靠當地的一個居民。那人打發他到田裡去放豬，"},{"n":16,"text":"他恨不得吃豬所吃的豆莢，可是沒有人給他。"},{"n":17,"text":"他醒悟過來，說：『我父親有那麼多雇工，又有豐富的食物，我卻要在這裡餓死嗎？"},{"n":18,"text":"我要起來，到我父親那裡去，對他說：爸爸，我得罪了天，也得罪了你，"},{"n":19,"text":"不配再稱為你的兒子，把我當作一個雇工吧！』"},{"n":20,"text":"於是他起來往父親那裡去。他還在遠處時，他父親看見了他，就動了慈心，跑過去抱著他，連連與他親吻。"},{"n":21,"text":"兒子說：『爸爸，我得罪了天，也得罪了你，不配再稱為你的兒子。』"},{"n":22,"text":"父親卻吩咐僕人說：『快把那最好的袍子拿來給他穿，把戒指戴在他手上，把鞋穿在他腳上，"},{"n":23,"text":"把肥牛犢牽來宰了，我們要吃喝快樂，"},{"n":24,"text":"因為我這兒子是死而復活、失而又得的。』他們就歡樂起來。"},{"n":25,"text":"「那時，大兒子正在田裡。他回來離家不遠的時候，聽見音樂跳舞的聲音，"},{"n":26,"text":"就叫了一個僕人來，問他這是怎麼一回事。"},{"n":27,"text":"僕人說：『你弟弟回來了，你父親因為他平安無恙地回來，就宰了肥牛犢。』"},{"n":28,"text":"大兒子就生氣，不肯進去；父親出來勸他。"},{"n":29,"text":"他對父親說：『你看，我服事你這麼多年，從來沒有違背過你的命令，可是你沒有給我一隻山羊羔，叫我和朋友一同歡樂。"},{"n":30,"text":"但你這個兒子，常常跟娼妓在一起，花盡了你的財產，他一回來，你倒為他宰殺肥牛犢！』"},{"n":31,"text":"父親對他說：『孩子，你常跟我在一起，我的一切都是你的。"},{"n":32,"text":"只是因為你這個弟弟是死而復活、失而又得的，我們應該歡喜快樂。』」"}],"src":"ncv"}]},{"date":"2027-02-28","dow":"日","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"馬太福音 6:5–8","title":"不要故意叫人看見","tip":"你們禱告，不可像那假冒為善的人。你禱告的時候，要進你的內屋，關上門，禱告你在暗中的父。","sat":false,"passages":[{"osis":"Matt","fhl":"太","chap":6,"secs":"5-8","verses":[{"n":5,"text":"「你們禱告的時候，不要像偽君子那樣，他們喜歡站在會堂裏和十字路口上禱告，為要讓人看見。我實在告訴你們，他們已得到他們的獎賞了。"},{"n":6,"text":"你禱告的時候，要進入內室，關上門，向那位在隱密中的父禱告；你父在隱密中察看，必定獎賞你。"},{"n":7,"text":"你們禱告的時候，不要像外族人那樣，說話空洞，絮絮叨叨，他們以為話多了就必蒙垂聽。"},{"n":8,"text":"不要像他們那樣，因為你們祈求以前，你們的父已知道你們的需要了。"}],"src":"ccv"}]},{"date":"2027-03-01","dow":"一","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"馬太福音 6:9–10","title":"願人都尊你的名為聖","tip":"我們在天上的父，願人都尊你的名為聖。願你的國降臨。願你的旨意行在地上，如同行在天上。","sat":false,"passages":[{"osis":"Matt","fhl":"太","chap":6,"secs":"9-10","verses":[{"n":9,"text":"所以你們要這樣禱告：『我們在天上的父，願你的名被尊為聖，"},{"n":10,"text":"願你的國降臨，願你的旨意成就在地上，如同在天上那樣。"}],"src":"ccv"}]},{"date":"2027-03-02","dow":"二","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"馬太福音 6:11–13","title":"日用的飲食","tip":"我們日用的飲食，今日賜給我們。免我們的債，不叫我們遇見試探，救我們脫離兇惡。","sat":false,"passages":[{"osis":"Matt","fhl":"太","chap":6,"secs":"11-13","verses":[{"n":11,"text":"求你今日賜給我們當天所需要的食物。"},{"n":12,"text":"求你免去我們的罪債，正如我們免去別人的罪債。"},{"n":13,"text":"求你不要讓我們陷入試探，救我們脫離那惡者。』"}],"src":"ccv"}]},{"date":"2027-03-03","dow":"三","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"馬太福音 6:14–15","title":"饒恕人","tip":"你們饒恕人的過犯，你們的天父也必饒恕你們。","sat":false,"passages":[{"osis":"Matt","fhl":"太","chap":6,"secs":"14-15","verses":[{"n":14,"text":"「你們若寬恕別人的過犯，你們的天父也必寬恕你們；"},{"n":15,"text":"你們若不寬恕別人，你們的父也必不寬恕你們的過犯。」"}],"src":"ccv"}]},{"date":"2027-03-04","dow":"四","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"路加福音 11:9–13","title":"祈求就給你們","tip":"你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。","sat":false,"passages":[{"osis":"Luke","fhl":"路","chap":11,"secs":"9-13","verses":[{"n":9,"text":"我又告訴你們，你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。"},{"n":10,"text":"因為所有祈求的就得著，尋找的就尋見，叩門的就給他開門。"},{"n":11,"text":"你們中間作父親的，哪有兒子求魚（較後期的抄本多數作「兒子要餅，卻給他石頭呢？），反拿蛇給他呢？"},{"n":12,"text":"或求雞蛋，反給他蠍子呢？"},{"n":13,"text":"你們雖然不好，尚且知道把好東西給自己的兒女，何況天父，豈不更把聖靈賜給求他的人嗎？」"}],"src":"ncv"}]},{"date":"2027-03-05","dow":"五","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"腓立比書 4:6–7","title":"神的平安","tip":"應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將所要的告訴神。","sat":false,"passages":[{"osis":"Phil","fhl":"腓","chap":4,"secs":"6-7","verses":[{"n":6,"text":"應當毫無憂慮，只要凡事藉著禱告祈求，帶著感恩的心，把你們所要的告訴 神。"},{"n":7,"text":"這樣， 神所賜超過人能了解的平安，必在基督耶穌裡，保守你們的心思意念。"}],"src":"ncv"}]},{"date":"2027-03-06","dow":"六","week":25,"theme":"你們禱告要這樣","verse":"約 3:16","ref":"馬太福音 6:5–15","title":"今晚家庭崇拜","tip":"朝早讀短段。今晚學主禱文。","sat":true,"passages":[{"osis":"Matt","fhl":"太","chap":6,"secs":"5-15","verses":[{"n":5,"text":"「你們禱告的時候，不要像偽君子那樣，他們喜歡站在會堂裏和十字路口上禱告，為要讓人看見。我實在告訴你們，他們已得到他們的獎賞了。"},{"n":6,"text":"你禱告的時候，要進入內室，關上門，向那位在隱密中的父禱告；你父在隱密中察看，必定獎賞你。"},{"n":7,"text":"你們禱告的時候，不要像外族人那樣，說話空洞，絮絮叨叨，他們以為話多了就必蒙垂聽。"},{"n":8,"text":"不要像他們那樣，因為你們祈求以前，你們的父已知道你們的需要了。"},{"n":9,"text":"所以你們要這樣禱告：『我們在天上的父，願你的名被尊為聖，"},{"n":10,"text":"願你的國降臨，願你的旨意成就在地上，如同在天上那樣。"   if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "zh-HK";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
function renderScripture(d) {
  $("scripture").innerHTML = (d.passages || []).map((p) => {
    const name = p.src === "ccv" ? "新漢語譯本" : "新譯本";
    const copy = p.src === "ccv"
      ? "經文引自《聖經．新漢語譯本》，版權屬於漢語聖經協會有限公司。"
      : "經文引自《聖經新譯本》，版權屬於環球聖經公會。";
    const verses = p.verses || [];
    const body = verses.length
      ? verses.map((v) => `<p class="v"><span class="n">${v.n}</span>${escapeHtml(v.text)}</p>`).join("")
      : `<p class="miss">呢幾節暫時載入唔到，請打開家裡聖經讀 ${p.chap}:${p.secs}。</p>`;
    return `<div class="pass">
      <div class="pass-head">${name} · ${p.chap}:${p.secs}</div>
      <div class="verses">${body}</div>
      <p class="copy">${copy}</p>
    </div>`;
  }).join("");
}
function verseSpeech(d) {
  return (d.passages || [])
    .flatMap((p) => p.verses || [])
    .map((v) => v.text)
    .join("");
}
function render() {
  const d = DAYS[idx];
  const set = ticks();
  const done = set.has(d.date);
  $("meta").textContent = `${d.date}　星期${d.dow}　·　崇拜第 ${d.week} 週　${d.theme}　·　金句 ${d.verse}`;
  $("title").textContent = d.title;
  $("ref").textContent = d.ref;
  $("tip").textContent = d.tip;
  $("satNote").hidden = !d.sat;
  $("btnTick").textContent = done ? "已讀完 ✓  再撳取消" : "讀完，tick";
  $("btnTick").classList.toggle("on", done);
  document.querySelectorAll("#who button").forEach((b) => b.classList.toggle("on", b.dataset.who === who));
  renderScripture(d);
  paintStats();
  renderCal();
  localStorage.setItem("fw-daily-idx", String(idx));
}
function renderCal() {
  const set = ticks();
  const first = new Date(month.y, month.m, 1);
  const start = (first.getDay());
  const last = new Date(month.y, month.m + 1, 0).getDate();
  $("monthTitle").textContent = `${month.y} 年 ${month.m + 1} 月`;
  const cells = ["日","一","二","三","四","五","六"].map((x) => `<b>${x}</b>`);
  for (let i = 0; i < start; i++) cells.push(`<button class="day mute" disabled></button>`);
  const today = todayIso();
  for (let n = 1; n <= last; n++) {
    const iso = `${month.y}-${String(month.m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
    const has = DAYS.some((d) => d.date === iso);
    const cls = ["day", set.has(iso) ? "done" : "", iso === today ? "today" : "", has ? "" : "mute"].join(" ");
    cells.push(`<button class="${cls}" data-iso="${iso}" ${has ? "" : "disabled"}>${n}</button>`);
  }
  $("cal").innerHTML = cells.join("");
  $("cal").querySelectorAll("button[data-iso]").forEach((b) => {
    b.onclick = () => {
      idx = indexOfDate(b.dataset.iso);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });
}

$("btnTick").onclick = () => {
  const set = ticks();
  const iso = DAYS[idx].date;
  if (set.has(iso)) set.delete(iso);
  else set.add(iso);
  saveTicks(set);
  render();
  toast(set.has(iso) ? "剔咗。聽日繼續。" : "取消剔咗。");
};
$("btnRead").onclick = () => {
  const d = DAYS[idx];
  const body = verseSpeech(d);
  speak(body ? `${d.ref}。${body}` : `今日讀${d.ref}。${d.tip}`);
};
$("btnStop").onclick = () => speechSynthesis.cancel();
$("prev").onclick = () => { idx = Math.max(0, idx - 1); month = { y: Number(DAYS[idx].date.slice(0,4)), m: Number(DAYS[idx].date.slice(5,7))-1 }; render(); };
$("next").onclick = () => { idx = Math.min(DAYS.length-1, idx + 1); month = { y: Number(DAYS[idx].date.slice(0,4)), m: Number(DAYS[idx].date.slice(5,7))-1 }; render(); };
$("now").onclick = () => {
  idx = indexOfDate(todayIso());
  month = { y: Number(DAYS[idx].date.slice(0,4)), m: Number(DAYS[idx].date.slice(5,7))-1 };
  render();
};
$("mPrev").onclick = () => { month.m -= 1; if (month.m < 0) { month.m = 11; month.y -= 1; } renderCal(); };
$("mNext").onclick = () => { month.m += 1; if (month.m > 11) { month.m = 0; month.y += 1; } renderCal(); };
$("who").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  who = b.dataset.who;
  localStorage.setItem("fw-daily-who", who);
  render();
};
speechSynthesis.onvoiceschanged = () => {};
idx = indexOfDate(todayIso());
month = { y: Number(DAYS[idx].date.slice(0,4)), m: Number(DAYS[idx].date.slice(5,7))-1 };
render();
</script>
</body>
</html>
